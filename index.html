<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ship It?</title>
<meta name="description" content="A 10 to 12 minute game about launch review for an AI feature: work out which rules apply, then see what happens when the law changes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Same visual system as The 2AM Page and Keys to the Agent. */
:root{
  --bg:#f3f1ee; --panel:#ffffff; --ink:#1c1a19; --muted:#6a6460; --line:#dcd6d0;
  --red:#cc0000; --red-soft:#fbe6e6; --aqua:#00796b; --aqua-soft:#e2f2ef; --amber:#a35a00; --amber-soft:#fbefdc;
  --good:#2e7d4f; --good-soft:#e3f2e8; --shadow:0 1px 0 rgba(0,0,0,.04);
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161413; --panel:#211e1c; --ink:#f1ece8; --muted:#a69d97; --line:#3a3532;
  --red:#ff6b6b; --red-soft:#3a1f1f; --aqua:#4fc3b1; --aqua-soft:#16302c; --amber:#f0a94b; --amber-soft:#35281a;
  --good:#6fcf97; --good-soft:#18301f; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161413; --panel:#211e1c; --ink:#f1ece8; --muted:#a69d97; --line:#3a3532;
  --red:#ff6b6b; --red-soft:#3a1f1f; --aqua:#4fc3b1; --aqua-soft:#16302c; --amber:#f0a94b; --amber-soft:#35281a;
  --good:#6fcf97; --good-soft:#18301f; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0}
.credit{margin-top:32px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.credit a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.1;text-wrap:balance;margin:0}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--aqua);outline-offset:2px}
a{color:var(--aqua)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:3px solid var(--red);padding-bottom:10px;margin-bottom:22px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-size:28px;letter-spacing:.01em}
.brand .eyebrow{color:var(--red)}
.linkbtn{background:none;border:1px solid var(--line);border-radius:6px;padding:6px 12px;font-size:14px;color:var(--muted)}
.linkbtn:hover{border-color:var(--ink);color:var(--ink)}
.intro{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:start}
.intro .lede{font-size:19px;max-width:60ch}
.intro h2{font-size:44px;margin:6px 0 14px}
.rules{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;box-shadow:var(--shadow)}
.rules ul{margin:8px 0 0;padding-left:18px}
.rules li{margin:6px 0}
.cases{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:26px}
.case{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:8px;text-align:left}
.case:hover{border-color:var(--ink)}
.case h3{font-size:21px}
.case p{margin:0;font-size:14px;color:var(--muted)}
.tag{display:inline-block;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);align-self:flex-start}
.primary{background:var(--red);color:#fff;border:0;border-radius:8px;padding:13px 22px;font-weight:600;font-size:16px}
.primary:hover{filter:brightness(1.08)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:22px}
.note{font-size:13px;color:var(--muted)}
.game{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px;align-items:start}
.scene{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.scene-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)}
.clock{font-family:var(--f-mono);font-weight:600;font-size:15px;color:var(--red)}
.step{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.scene-body{padding:20px 22px 24px}
.scene-body h2{font-size:30px;margin-bottom:10px}
.scene-body p{margin:0 0 12px;max-width:68ch}
.inject{border-left:4px solid var(--ink);background:var(--bg);padding:10px 14px;border-radius:0 8px 8px 0;margin:4px 0 16px;font-size:15px}
.inject .eyebrow{display:block;margin-bottom:2px}
.outcome{border-radius:10px;padding:14px 16px;margin:4px 0 16px;border:1px solid var(--line)}
.outcome.l0{background:var(--good-soft);border-color:var(--good)}
.outcome.l1{background:var(--amber-soft);border-color:var(--amber)}
.outcome.l2{background:var(--red-soft);border-color:var(--red)}
.outcome .verdict{display:block;margin-bottom:4px}
.l0 .verdict{color:var(--good)} .l1 .verdict{color:var(--amber)} .l2 .verdict{color:var(--red)}
.outcome p{margin:0}
.ask{font-weight:600;margin-top:4px!important}
.choices{display:grid;gap:10px;margin-top:8px}
.choice{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;align-items:start;text-align:left;background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px}
.choice:hover{border-color:var(--ink)}
.choice .k{font-family:var(--f-mono);font-weight:600;border:1px solid var(--line);border-radius:6px;text-align:center;padding:2px 0;color:var(--muted)}
.choice[disabled]{cursor:default;opacity:.55}
.choice.picked{opacity:1;border-color:var(--ink)}
.result{margin-top:18px;border-radius:10px;padding:16px 18px;border:1px solid var(--line);background:var(--bg)}
.result.best{background:var(--good-soft);border-color:var(--good)}
.result.ok{background:var(--amber-soft);border-color:var(--amber)}
.result.poor{background:var(--red-soft);border-color:var(--red)}
.verdict{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.best .verdict{color:var(--good)} .ok .verdict{color:var(--amber)} .poor .verdict{color:var(--red)}
.result p{margin:6px 0 0}
.lesson{font-size:14px;color:var(--muted);margin-top:8px!important}
.result .primary{margin-top:14px}
.rail{display:grid;gap:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.board{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.board h3{font-size:18px;margin-bottom:10px}
.co{font-weight:600}
.co-sub{font-size:13px;color:var(--muted);margin-bottom:12px}
.meter{margin:10px 0}
.meter .lab{display:flex;justify-content:space-between;font-size:13px}
.meter .lab b{font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums}
.meter .hint{font-size:11px;color:var(--muted)}
.bar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;border:1px solid var(--line);margin-top:4px}
.bar i{display:block;height:100%;border-radius:99px;transition:width .5s ease}
.legs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.leg{font-family:var(--f-mono);font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.leg.on{border-color:var(--red);color:var(--red);background:var(--red-soft)}
.leg.half{border-color:var(--amber);color:var(--amber);background:var(--amber-soft)}
.log{list-style:none;margin:0;padding:0;font-size:13px;max-height:320px;overflow:auto}
.log li{display:grid;grid-template-columns:76px minmax(0,1fr);gap:8px;padding:7px 0;border-top:1px dashed var(--line)}
.log li:first-child{border-top:0}
.log time{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.log .empty{display:block;color:var(--muted);font-style:italic}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.progress{display:flex;gap:4px;padding:10px 20px 14px;border-top:1px solid var(--line)}
.progress span{flex:1;height:6px;border-radius:99px;background:var(--line)}
.progress span.done{background:var(--ink)}
.progress span.now{background:var(--red)}
.progress span.live{outline:1px dashed var(--muted);outline-offset:1px}
.end h2{font-size:40px;margin:6px 0 10px}
.grid2{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat .n{font-family:var(--f-mono);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.stat .l{font-size:13px;color:var(--muted)}
.trifecta{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:22px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
.trifecta svg{width:100%;height:auto}
.trifecta svg text{font-family:var(--f-mono);font-size:11px;fill:var(--ink)}
.debrief{display:grid;gap:10px;margin-top:10px}
.dl{background:var(--panel);border:1px solid var(--line);border-left-width:5px;border-radius:8px;padding:12px 14px}
.dl.best{border-left-color:var(--good)} .dl.ok{border-left-color:var(--amber)} .dl.poor{border-left-color:var(--red)}
.dl .h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-family:var(--f-mono)}
.dl p{margin:6px 0 0;font-size:15px}
.real{background:var(--aqua-soft);border:1px solid var(--aqua);border-radius:10px;padding:16px 18px;margin-top:22px}
.real h3{font-size:22px;color:var(--aqua);margin-bottom:6px}
.real ul{margin:6px 0 0;padding-left:18px}
.real li{margin:6px 0}
.sec{margin-top:28px}
.sec>h3{font-size:24px;margin-bottom:8px}
@media (max-width:860px){.game,.intro,.trifecta{grid-template-columns:minmax(0,1fr)}.rail{position:static}.cases,.grid2{grid-template-columns:minmax(0,1fr)}.intro h2{font-size:34px}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
@media print{
  :root,:root[data-theme="dark"]{--bg:#ffffff;--panel:#ffffff;--ink:#1c1a19;--muted:#555;--line:#cfcfcf;color-scheme:light}
  body{background:#fff;font-size:11pt}
  .wrap{max-width:none;padding:0}
  .topbar{margin-bottom:12px}
  #homeBtn,.end .row,.rail .log{display:none!important}
  .game{display:block}
  .rail{display:none!important}
  .grid2{grid-template-columns:repeat(4,minmax(0,1fr))!important}
  .trifecta{grid-template-columns:200px minmax(0,1fr)!important}
  .dl,.stat,.real,.outcome,.trifecta{break-inside:avoid;page-break-inside:avoid}
  .printonly{display:block!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact;box-shadow:none!important}
  @page{margin:14mm}
}
.printonly{display:none}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div class="brand"><h1>Ship It?</h1><span class="eyebrow">AI launch review</span></div>
    <button class="linkbtn" id="homeBtn" hidden>New scenario</button>
  </header>
  <main id="app"></main>
  <footer class="credit">&copy; 2026 Chuck Kesler &middot; Licensed under <a href="https://creativecommons.org/licenses/by-nc/4.0/" rel="license noopener" target="_blank">CC BY-NC 4.0</a> &middot; Law as of November 2026 &middot; An educational game, not legal advice</footer>
</div>

<script>
(function(){
"use strict";
var M = {sch:'Launch schedule', exp:'Legal exposure', tru:'Customer trust'};
var HINT = {sch:'higher is better', exp:'lower is better', tru:'higher is better'};

/* Each step: label, title, text, choices (t, v, fx, r, l). v = best / ok / poor. */
var C = [];

C.push({
 id:'larkspur', name:'Larkspur HR', sector:'HR and benefits software vendor · Denver, CO', tag:'Hiring AI',
 blurb:'1,400 business customers in the US and Europe. Product wants to ship an AI feature that ranks job applicants.',
 feature:'TalentRank', pitch:'Product wants to launch <b>TalentRank</b>, an AI feature that reads applications and ranks candidates for customers\' recruiters. Customers in the US and the EU are asking for it, and sales has promised a date.',
 start:{sch:70, exp:30, tru:70},
 steps:[
  {label:'Review 1', title:'What kind of AI is this?', text:'<p>Legal asks a basic question first: where does TalentRank sit under the EU AI Act, given that customers in the EU will use it?</p>',
   choices:[
    {t:'High-risk. AI used to rank and filter job applicants is on the Act\'s high-risk list.', v:'best', fx:{exp:-10, sch:-5},
     r:'Legal agrees, and the team plans for the high-risk duties: risk management, documentation, human oversight and testing.',
     l:'Hiring is one of the Act\'s high-risk uses. The Act\'s narrow exceptions don\'t cover a system that profiles people, and ranking candidates does, so a recruiter making the final call doesn\'t take it off the list.', ref:'EU AI Act risk tiers'},
    {t:'Probably minimal risk, since a recruiter always makes the final decision.', v:'ok', fx:{exp:10},
     r:'Legal pushes back: the Act lists AI used to filter applications and evaluate candidates as high-risk, with or without a human signing off.',
     l:'Human review matters, but it doesn\'t change the tier for a tool that ranks people for jobs.', ref:'EU AI Act risk tiers'},
    {t:'Not covered at all, because Larkspur is an American company.', v:'poor', fx:{exp:20, tru:-5},
     r:'Outside counsel corrects this quickly. Like GDPR, the Act reaches providers whose AI systems are used in the EU.',
     l:'Selling into the EU, or the system\'s output being used there, brings a company within reach, wherever it\'s based.', ref:'EU AI Act scope'}
  ]},
  {label:'Review 2', title:'Who carries the obligations?', text:'<p>A large EU customer asks who is responsible for meeting the Act\'s requirements: Larkspur, which builds TalentRank, or the employer that uses it?</p>',
   choices:[
    {t:'Both. Larkspur is the provider and the employer is a deployer, and each has its own duties.', v:'best', fx:{exp:-5, tru:5},
     r:'The customer is relieved to get a straight answer, and asks for the documentation Larkspur will provide to help it meet its own duties.',
     l:'The Act separates the provider, who builds the system, from the deployer, who uses it. Both have obligations.', ref:'Provider and deployer'},
    {t:'Mostly the employer, since it makes the hiring decisions.', v:'ok', fx:{exp:10},
     r:'The customer\'s lawyers disagree, and the deal slows down while the two sides sort out who owes what.',
     l:'Deployers have duties, but the heaviest high-risk obligations sit with the provider.', ref:'Provider and deployer'},
    {t:'Nobody yet. The high-risk rules were deferred, so they may never happen.', v:'poor', fx:{exp:15, tru:-10},
     r:'The customer notes that the rules were deferred to December 2027, not dropped, and starts talking to a competitor.',
     l:'"The AI Act was delayed" is only partly true. The high-risk obligations moved to December 2027; they didn\'t go away.', ref:'EU AI Act dates'}
  ]},
  {label:'Review 3', title:'Training on customers\' applicants', text:'<p>The data science team wants to make TalentRank more accurate by training it on the applicant data Larkspur already holds for its customers: millions of past applications.</p>',
   choices:[
    {t:'Only where customer contracts allow it, and with the data minimized and pseudonymized first. Ask customers.', v:'best', fx:{exp:-10, sch:-5, tru:5},
     r:'Most customers agree for a subset of data under updated terms. A few say no, and their data stays out.',
     l:'For its customers\' applicant data, Larkspur is a processor and can use it only as its customers instruct. Training its own model is a new purpose: Larkspur would need customer agreement, its own legal basis, and a way to tell applicants.', ref:'Processors and training data'},
    {t:'Go ahead, but strip names and email addresses first.', v:'ok', fx:{exp:10},
     r:'Removing names helps, but pseudonymized data is still personal data for a company that can link it back, and the customers never agreed to this use.',
     l:'Pseudonymization reduces risk. It doesn\'t create permission that the contract doesn\'t give.', ref:'Pseudonymization'},
    {t:'Go ahead. The terms of service already allow "product improvement."', v:'poor', fx:{exp:20, tru:-15, sch:5},
     r:'A customer\'s privacy team spots the clause and asks whether its applicants\' data is in the model. Nobody can say no.',
     l:'Regulators have warned AI companies that using customer data for training beyond what they promised can be unfair or deceptive. There\'s no AI exemption.', ref:'Vendor training on customer data'}
  ]},
  {label:'Review 4', title:'A California customer asks', text:'<p>A large California employer plans to use TalentRank and asks what California\'s rules on automated decision-making, which apply from January 2027, will mean for it.</p>',
   choices:[
    {t:'Help them give applicants notice before use, offer an opt-out or a human appeal, and explain decisions on request.', v:'best', fx:{exp:-10, tru:5, sch:-5},
     r:'Larkspur adds a notice template, an appeal workflow and a decision explanation to the product. Other customers want them too.',
     l:'Hiring is a "significant decision" under the California rules. A vendor that builds in the pieces customers need sells more easily.', ref:'Automated decision-making'},
    {t:'Tell them it\'s their obligation as the business using the tool, not Larkspur\'s.', v:'ok', fx:{tru:-5, exp:5},
     r:'Under the privacy rules, the duties fall mostly on the employer. California\'s employment discrimination rules can also reach a vendor screening applicants on an employer\'s behalf. The customer decides the vendor that helps is worth paying for.',
     l:'Even where the law puts the duty on the customer, the product decides whether they can meet it.', ref:'Automated decision-making'},
    {t:'Tell them California doesn\'t regulate AI hiring tools.', v:'poor', fx:{exp:15, tru:-10},
     r:'The customer\'s counsel sends Larkspur a copy of the regulations.',
     l:'California\'s privacy agency adopted rules on automated decision-making technology in 2025 that apply from January 2027, and its employment discrimination rules already cover automated hiring tools.', ref:'Automated decision-making'}
  ]},
  {label:'News flash', flash:true, title:'Colorado changes the rules', text:'<div class="inject"><span class="eyebrow">May 2026 · Denver</span>Colorado repeals the broad AI law it passed in 2024, which Larkspur\'s compliance program was built around, and replaces it with a narrower law effective January 2027: notice before use, an explanation after an adverse decision, a way to correct wrong data, and human review in some cases.</div><p>Larkspur is headquartered in Denver. Last year it built a risk management program and impact-assessment documentation for its customers around the old law. What now?</p>',
   choices:[
    {t:'Keep the risk management work, which the EU requires anyway, and build in support for Colorado\'s new notice, explanation, correction and review steps.', v:'best', fx:{exp:-10, tru:5},
     r:'Most of last year\'s work carries over. The new Colorado steps fit into the California workflow already being built.',
     l:'In AI law, plan for the rules to change. Build controls that satisfy several laws at once, so one change doesn\'t mean starting over.', ref:'Watching for change'},
    {t:'Pause all Colorado work until the lawsuits over AI regulation settle down.', v:'ok', fx:{exp:5, sch:5},
     r:'The new law still applies to decisions from January 2027. A lawsuit has paused enforcement for now, but nothing has been struck down, and the duties can be enforced as soon as the pause ends. The team is now behind.',
     l:'Waiting for certainty can mean waiting forever. Plan for what\'s in force and what\'s coming.', ref:'Watching for change'},
    {t:'Scrap the compliance program. The law that required it is gone.', v:'poor', fx:{exp:20, sch:10, tru:-5},
     r:'Two months later, an EU customer asks for the risk documentation the program produced. It no longer exists.',
     l:'The work served more than one law. Tearing it down because one law changed leaves gaps everywhere else.', ref:'Watching for change'}
  ]},
  {label:'Launch call', title:'Ship it?', text:'<p>Sales wants a date. What\'s your recommendation for the EU launch?</p>',
   choices:[
    {t:'Launch with a recruiter reviewing every rejection, and a plan to meet the high-risk duties before December 2027.', v:'best', fx:{exp:-5, tru:10, sch:-5},
     r:'The launch goes ahead on a slightly later date. Customers like the human review step, and as long as recruiters really weigh each case, it keeps decisions from being solely automated.',
     l:'GDPR already restricts decisions based solely on automated processing that significantly affect people, and a rejected job application is one.', ref:'GDPR Article 22'},
    {t:'Hold the EU launch until December 2027, when the high-risk rules apply.', v:'ok', fx:{sch:-25, exp:-5},
     r:'Safe, and a competitor takes most of the EU customers in the meantime.',
     l:'Waiting avoids the risk, at a business cost. The rules can be met before they\'re enforced.', ref:'Launch decisions'},
    {t:'Launch with fully automated rejections to save recruiters time.', v:'poor', fx:{exp:25, tru:-15, sch:10},
     r:'An applicant in Germany asks why she was rejected and who reviewed it. The answer is nobody.',
     l:'A solely automated rejection triggers GDPR Article 22 rights, and it\'s exactly what the high-risk rules are designed to prevent.', ref:'GDPR Article 22'}
  ]}
 ],
 law:['EU AI Act: AI used in recruitment and selection is high-risk. Those obligations apply from 2 December 2027, after an amendment adopted in July 2026; the prohibitions, AI literacy and transparency rules already apply.',
      'GDPR Article 22 gives people rights around decisions based solely on automated processing that significantly affect them.',
      'California\'s rules on automated decision-making technology apply from 1 January 2027 to significant decisions, including employment.',
      'Colorado repealed and replaced its 2024 AI Act in May 2026. The new law applies from 1 January 2027, though a federal court order currently pauses enforcement while a constitutional challenge is pending.'],
 note:'Larkspur HR and TalentRank are invented. The laws are real, as of November 2026.'
});

C.push({
 id:'pinecrest', name:'Pinecrest Outfitters', sector:'Outdoor retailer · publicly traded · Asheville, NC', tag:'Shopping AI',
 blurb:'Two hundred stores and a website that ships to the US and Europe. Marketing wants an AI shopping assistant and personalized offers.',
 feature:'the AI shopping assistant', pitch:'Marketing wants to launch an <b>AI shopping assistant</b> on the website, plus <b>AI-personalized loyalty offers</b> built from what shoppers browse and buy. The site ships to the US and to the EU. They want it live before the holidays.',
 start:{sch:70, exp:30, tru:70},
 steps:[
  {label:'Review 1', title:'Do shoppers need to know?', text:'<p>Should shoppers be told they\'re chatting with AI rather than a person?</p>',
   choices:[

function shuffle(a){ for(var q=a.length-1;q>0;q--){var w=Math.floor(Math.random()*(q+1)),t=a[q];a[q]=a[w];a[w]=t;} return a; }

function intro(){

  picks.forEach(function(p){ var lab = p.v==='best'?'Strong call':p.v==='ok'?'Partly right':'Costly call';
    h += '<div class="dl '+p.v+'"><div class="h"><span>'+esc(p.label)+' · '+esc(p.title)+'</span><span>'+lab+' · '+esc(p.ref)+'</span></div><p><b>You chose:</b> '+esc(p.t)+'</p><p class="lesson" style="margin:6px 0 0;font-size:14px;color:var(--muted)">'+esc(p.l)+'</p></div>'; });
  h += '</div></div><div class="real"><h3>The law behind this scenario, as of November 2026</h3><ul>';
  co.law.forEach(function(x){h+='<li>'+esc(x)+'</li>';});
  h += '</ul><p class="note" style="margin-top:8px">'+esc(co.note)+' An educational game, not legal advice; these rules are changing quickly.</p></div>';
  h += '<div class="row"><button class="primary" id="again">Play another scenario</button><button class="linkbtn" id="same">Replay this one</button><button class="linkbtn" id="pdf">Download PDF</button><span class="note">Choose "Save as PDF" in the print window.</span></div></section>'+rail()+'</div>';
  app.innerHTML = h;
  var cur = C.indexOf(co);
  document.getElementById('again').onclick = function(){ var k; do{ k=Math.floor(Math.random()*C.length);}while(k===cur && C.length>1); start(k); };
  document.getElementById('same').onclick = function(){ start(cur); };
  document.getElementById('pdf').onclick = function(){ window.print(); };
  window.scrollTo(0,0);
}
homeBtn.onclick = function(){
  var inGame = picks && picks.length && !done;
  if(inGame && !armed){ armed = true; homeBtn.textContent = 'Leave this scenario?'; setTimeout(function(){ armed = false; homeBtn.textContent = 'New scenario'; }, 4000); return; }
  armed = false; homeBtn.textContent = 'New scenario'; intro();
};
intro();
})();
</script>
